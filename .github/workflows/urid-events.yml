name: URID lifecycle events

# On every push, scan the pushed commit messages (from the event payload) for
# URID references (e.g. URID_EDU_2026_0042) and log a COMMIT event against each
# in AdminPlatform, so the founder Trace page updates automatically.
#
# Requires repo secret ADMINPLATFORM_AGENT_TOKEN (EDU-scoped agent token).
# If the secret is absent, the job skips quietly (never fails your push).

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  log-urid-events:
    runs-on: ubuntu-latest
    steps:
      - name: Log COMMIT events for referenced URIDs
        env:
          API: https://adminplatform-production-4306.up.railway.app
          TOKEN: ${{ secrets.ADMINPLATFORM_AGENT_TOKEN }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "ADMINPLATFORM_AGENT_TOKEN not set — skipping URID event logging."
            exit 0
          fi
          found=0
          while read -r commit; do
            [ -z "$commit" ] && continue
            SHA=$(printf '%s' "$commit" | jq -r '.id')
            MSG=$(printf '%s' "$commit" | jq -r '.message')
            URIDS=$(printf '%s' "$MSG" | grep -oE 'URID_[A-Z]{2,6}_[0-9]{4}_[0-9]{4}(\.[0-9]+)?' | sort -u || true)
            for U in $URIDS; do
              found=1
              SUBJECT=$(printf '%s' "$MSG" | head -n1)
              payload=$(jq -n --arg s "$SUBJECT" --arg sha "$SHA" --arg repo "$REPO" --arg ref "$REF" \
                '{event_type:"COMMIT", description:$s, metadata:{sha:$sha, repo:$repo, ref:$ref}}')
              echo "→ $U  ($SHA)"
              curl -s -m 20 -o /dev/null -w "   HTTP %{http_code}\n" -X POST \
                "$API/api/v1/urids/$U/events" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload" || echo "   (request failed — non-blocking)"
            done
          done < <(printf '%s' "$COMMITS" | jq -c '.[]?')
          [ "$found" = "0" ] && echo "No URID references found in pushed commits."
          exit 0
